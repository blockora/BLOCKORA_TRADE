# BLOCKORA_TRADE v3 — scoring weights & feature groups (Phase 1 defaults)
# ALL VALUES ARE HEURISTIC PLACEHOLDERS pending Phase 8 calibration against outcomes.
# Weights are the ONLY scoring inputs here; changing them changes every model_score.
# weights_hash (sha256 of this file) is pinned into every recommendation row.

version: 1

families:
  # --- directional evidence (Stage 1 side scoring + Stage 2 strike scoring) ---
  trend:
    weight: 20
    group: directional_core
    components:
      ema_stack:        { kind: binary, good: true,  bad: false }
      adx:              { kind: threshold, good: 25.0, bad: 15.0 }
      mtf_alignment:    { kind: band, bands: [[8, 10], [6, 8], [3, 6], [0, 3]] }

  market_structure:
    weight: 15
    group: directional_core
    components:
      htf_structure:    { kind: threshold, good: 10.0, bad: 0.0 }
      swing_quality:    { kind: threshold, good: 8.0, bad: 2.0 }

  option_chain:
    weight: 15
    group: chain_evidence
    components:
      pcr_skew:         { kind: threshold, good: 10.0, bad: 0.0 }
      oi_wall_proximity: { kind: threshold, good: 8.0, bad: 2.0 }

  oi:
    weight: 10
    group: chain_evidence
    components:
      oi_change_direction: { kind: threshold, good: 10.0, bad: 0.0 }
      buildup_class:    { kind: threshold, good: 10.0, bad: 0.0 }

  volume:
    weight: 10
    group: flow_evidence
    components:
      volume_expansion: { kind: threshold, good: 10.0, bad: 0.0 }
      delta_proxy:      { kind: threshold, good: 10.0, bad: 0.0 }

  momentum:
    weight: 10
    group: flow_evidence
    components:
      roc:              { kind: threshold, good: 10.0, bad: 0.0 }
      vwap_side:        { kind: binary, good: true, bad: false }
      candle_body:      { kind: threshold, good: 10.0, bad: 0.0 }   # pattern witness slot

  liquidity:
    weight: 10
    group: microstructure
    components:
      spread_score:     { kind: threshold, good: 10.0, bad: 0.0 }
      depth_score:      { kind: threshold, good: 10.0, bad: 0.0 }

  volatility:
    weight: 5
    group: microstructure
    components:
      iv_rank_fit:      { kind: band, bands: [[8, 10], [6, 8], [4, 6], [2, 4]] }
      atr_state:        { kind: threshold, good: 8.0, bad: 2.0 }

  strike_quality:
    weight: 3
    group: strike_fit
    components:
      delta_fit:        { kind: band, bands: [[10, 7], [7, 4], [4, 2]] }   # abs_delta 0.40-0.60 ->10, 0.30-0.70 ->7, 0.20-0.80 ->4, else 2
      distance_atm_fit: { kind: threshold, good: 10.0, bad: 0.0 }

  risk_reward:
    weight: 2
    group: strike_fit
    components:
      rr_score:         { kind: threshold, good: 10.0, bad: 0.0 }

# Double-counting control (docs/SCORING.md section 4)
groups:
  directional_core: {}
  chain_evidence: {}
  flow_evidence: {}
  microstructure: {}
  strike_fit: {}

aggregation:
  within_family_damp: 0.5          # 2nd..nth correlated components contribute at 50%
  within_group_damp: 0.5           # 2nd..nth correlated FAMILIES inside a group contribute at 50%
  confirmation_weight_share: 0.5   # confirmation groups need an independent group >= 6 to count fully
  independent_group_min_score: 6.0
  degraded_data_factor: 0.7
  # NOTE: there is deliberately NO weight redistribution for missing data.
  # Scores are normalized by the TOTAL configured weight, so missing evidence
  # lowers the score honestly (docs/SCORING.md section 5).

side_gate:
  directional_families: [trend, market_structure, option_chain, oi, volume, momentum]
  min_side_score: 55.0
  min_side_margin: 10.0

tie_break:
  order: [model_score_desc, spread_pct_asc, distance_atm_asc, volume_desc]
